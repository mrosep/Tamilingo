name: Daily Tamil Word Update

# Run every day at 9:00 AM UTC (adjust timezone as needed)
# Also allow manual triggering for testing
on:
  schedule:
    - cron: '0 9 * * *'  # Daily at 9:00 AM UTC
  workflow_dispatch:  # Allows manual triggering from GitHub UI

jobs:
  add-new-word:
    runs-on: ubuntu-latest

    # Grant write permissions to push changes
    permissions:
      contents: write

    steps:
      # 1. Check out the repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Run the word fetcher script
      - name: Fetch and add new word from Cloudinary
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: node fetchCloudinaryWords.js

      # 5. Check if there are changes to commit
      - name: Check for changes
        id: check_changes
        run: |
          git diff --quiet script.js || echo "changes=true" >> $GITHUB_OUTPUT

      # 6. Commit and push if there are changes
      - name: Commit and push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add script.js
          git commit -m "$(cat <<'EOF'
          Add daily word from Cloudinary

          Automated daily word addition by GitHub Actions

          🤖 Generated with [Claude Code](https://claude.com/claude-code)

          Co-Authored-By: Claude <noreply@anthropic.com>
          EOF
          )"
          git push

      # 7. Report success
      - name: Report results
        if: steps.check_changes.outputs.changes == 'true'
        run: echo "✅ Successfully added a new word and pushed to repository!"

      - name: Report no changes
        if: steps.check_changes.outputs.changes != 'true'
        run: echo "ℹ️ No new words to add (all Cloudinary words are already in the app)"
