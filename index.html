<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tamilingo</title>
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="/manifest.json">
</head>
<body>
    <div class="container">
        <header>
            <h1>Tamilingo</h1>
        </header>

        <!-- Home Page -->
        <div id="home-page" class="page active">
            <div class="home-tiles-container">
                <div class="home-tile" data-page="word-list">
                    <span>Word List</span>
                </div>
                <div class="home-tile" data-page="revise">
                    <span>Revise</span>
                </div>
            </div>
        </div>

        <!-- Word List Page -->
        <div id="word-list-page" class="page">
            <div class="search-container">
                <input
                    type="text"
                    id="search-input"
                    placeholder="Search for words..."
                    autocomplete="off"
                >
                <span class="search-icon">🔍</span>
            </div>

            <main>
                <div id="tile-container"></div>
            </main>
        </div>

        <!-- Revise Page -->
        <div id="revise-page" class="page">
            <div class="swipe-indicators">
                <div class="swipe-indicator swipe-left">
                    <span class="indicator-label">Tricky</span>
                    <span class="indicator-arrow red">&#8592;</span>
                </div>
                <div class="swipe-indicator swipe-right">
                    <span class="indicator-label">Easy</span>
                    <span class="indicator-arrow green">&#8594;</span>
                </div>
            </div>
            <div class="revise-container">
                <div id="revise-tile-next" class="revise-tile revise-tile-next">
                    <!-- Next word will be displayed here -->
                </div>
                <div id="revise-tile" class="revise-tile revise-tile-current">
                    <!-- Current word will be displayed here -->
                </div>
            </div>
            <!-- Completion screen - shown when all words are revised -->
            <div id="revise-complete" class="revise-complete hidden">
                <div class="complete-content">
                    <h2>Congrats, all words revised!</h2>
                    <button id="revise-again-btn" class="revise-again-btn">Revise again?</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
